[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noteforge"
version = "1.1.0"
description = "Open-source rhythm-chart drafting model, inference runtime, and HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.5",
  "torchaudio>=2.5",
  "numpy>=1.26",
  "transformers==4.53.2",
  "safetensors>=0.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9"]
dev = ["httpx>=0.27", "pytest>=8"]
mlx = ["mlx>=0.22"]

[project.scripts]
noteforge = "noteforge.cli:main"
noteforge-draft = "noteforge.scripts.draft_song:main"
noteforge-doctor = "noteforge.scripts.doctor:main"

[tool.setuptools.packages.find]
include = ["noteforge*", "noteforge_api*"]
