name: cpu-x86-benchmark

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Fixture length in seconds
        default: '8'
      runs:
        description: Runs per thread count
        default: '3'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the CPU runtime
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -e '.[api]'
      - name: Record the host
        run: |
          lscpu | tee host.txt
          python -c "import platform, torch; print(platform.platform(), torch.__version__)" | tee -a host.txt
      - name: Download the published r5 weights
        run: |
          mkdir -p models
          curl -L --fail -o models/noteforge-r5.pt \
            https://github.com/Yukoval-Dakia/noteforge/releases/download/v1.0.0/noteforge-r5.pt
          echo "1b1f2e8dee82101690778ef667b661fa1d88421f50034c0bd97572f3067d405b  models/noteforge-r5.pt" | sha256sum -c -
      - name: Build the synthetic fixture
        run: python -m noteforge.scripts.make_bench_fixture --out bench --seconds '${{ inputs.seconds }}'
      - name: Measure every thread count
        run: |
          for threads in 1 2 4; do
            for run in $(seq 0 $(( ${{ inputs.runs }} - 1 ))); do
              python -m noteforge.scripts.bench_backends \
                --backend torch --device cpu --cpu-threads "$threads" --cpu-interop-threads 1 \
                --audio bench/silence.wav --features-dir bench --mode phira --level 10 \
                --batch-size 64 --scheduler grouped --runs 1 \
                --out-dir "results/t${threads}-r${run}" >> results.jsonl
            done
          done
      - name: Summarize
        run: python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, statistics
          rows = [json.loads(line) for line in open('results.jsonl') if line.startswith('{')]
          by_threads = {}
          for row in rows:
              threads = row['runtime']['torch']['cpu_threads']
              by_threads.setdefault(threads, []).append(row)
          print('| threads | runs | generation median s | range s | tokens | identical |')
          print('|---|---|---|---|---|---|')
          for threads, group in sorted(by_threads.items()):
              values = [r['generation_s'] for r in group]
              outputs = {r['output_sha256'] for r in group}
              print(f"| {threads} | {len(group)} | {statistics.median(values):.3f} | "
                    f"{min(values):.3f}..{max(values):.3f} | {group[0]['tokens']} | {len(outputs) == 1} |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-x86-benchmark
          path: |
            host.txt
            results.jsonl
